name: 環境検証

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  environment:
    name: 環境検証（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - name: 差分の空白を確認
        run: git diff --check
      - name: Linux初期化スクリプトの構文を確認
        if: runner.os == 'Linux'
        run: sh -n bootstrap.sh
      - name: Windows初期化スクリプトの構文を確認
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $content = [IO.File]::ReadAllText((Resolve-Path 'scripts/bootstrap.ps1'), [Text.UTF8Encoding]::new($false))
          [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Windowsのダウンロード検証と終了コードを確認
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $temporaryRoot = Join-Path $env:RUNNER_TEMP ('lab-dev-env-tests-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $temporaryRoot | Out-Null
          try {
            $content = [IO.File]::ReadAllText((Resolve-Path 'scripts/test-bootstrap.ps1'), [Text.UTF8Encoding]::new($false))
            & ([ScriptBlock]::Create($content)) -TemporaryRoot $temporaryRoot
          }
          finally { Remove-Item -LiteralPath $temporaryRoot -Recurse -Force }
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.3
          cache: true
      - name: 固定済みツールチェーンを導入
        run: mise install --locked
      - name: B3共通環境を同期
        run: uv sync --locked --project b3
      - name: DYNAMIXEL SDKを確認
        run: uv run --locked --project b3 python -c "import importlib.metadata as m; import dynamixel_sdk; assert m.version('dynamixel-sdk') == '4.1.0'"
      - name: 診断の失敗判定と固定版の整合性を確認
        run: uv run --locked --project b3 python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: 環境診断
        run: uv run --locked --project b3 python scripts/doctor.py

  windows-clean-bootstrap:
    name: Windowsクリーンbootstrap
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Gitなし・CLIなし相当から初期構築を検証
        shell: powershell
        run: |
          $content = [IO.File]::ReadAllText((Resolve-Path 'scripts/test-clean-bootstrap.ps1'), [Text.UTF8Encoding]::new($false))
          & ([ScriptBlock]::Create($content)) -RepositoryRoot $env:GITHUB_WORKSPACE
